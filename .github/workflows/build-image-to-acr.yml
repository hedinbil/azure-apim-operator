name: Build and Push to Azure Container Registry

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: 'Image version (leave empty to use DEFAULT_IMAGE_VERSION variable)'
        required: false
        default: ''

permissions:
  contents: write
  id-token: write
  pull-requests: write
  packages: write

env:
  ARM_CLIENT_ID: ${{ vars.OPERATIONS_AKS_PROD_AZURE_CLIENT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.OPERATIONS_AKS_PROD_AZURE_SUBSCRIPTION_ID }}
  ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  ACR_NAME: hedinit
  ACR_REGISTRY: hedinit.azurecr.io
  IMAGE_NAME: azure-apim-operator  
  GIT_USER_EMAIL: github-actions@hedinit.com
  GIT_USER_NAME: GitHub Actions - docker-image

jobs:
  build-and-push:
    runs-on: linux-runner-arc
    # The environment makes the OIDC subject ref-independent
    # (repo:hedinbil/azure-apim-operator:environment:acr), so the same federated
    # identity credential covers main pushes AND vX.Y.Z tag builds.
    environment: acr

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Git config user.email
        run: git config --global user.email "${{ env.GIT_USER_EMAIL }}"
      - name: Git config user.name
        run: git config --global user.name "${{ env.GIT_USER_NAME }}"        

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login via Azure CLI
        uses: Azure/login@v2
        with:
          client-id: ${{ env.ARM_CLIENT_ID }}
          subscription-id: ${{ env.ARM_SUBSCRIPTION_ID }}
          tenant-id: ${{ env.ARM_TENANT_ID }}

      - name: Login to Azure Container Registry
        run: |
          az acr login --name ${{ env.ACR_NAME }}

      - name: Get short SHA
        id: sha
        run: |
          echo "short_sha=${GITHUB_SHA::8}" >> $GITHUB_OUTPUT
          echo "🔖 Short SHA: ${GITHUB_SHA::8}"

      - name: Determine image version
        id: version
        run: |
          # Image version scenarios:
          # 
          # Scenario 1: Manual workflow dispatch (workflow_dispatch)
          #   - Base version: Uses the 'version' input parameter (default: v0.26.0)
          #   - Example tags: v0.26.0-abc12345, latest, v0.26.0-latest
          #
          # Scenario 2: Git tag push (refs/tags/*)
          #   - Base version: The tag name itself (e.g., v0.26.0)
          #   - Example tags: v0.26.0-def67890, latest, v0.26.0-latest
          #
          # Scenario 3: Push to main branch or pull request
          #   - Base version: Hardcoded to v0.26.0
          #   - Example tags: v0.26.0-12345678, latest, v0.26.0-latest
          #   - Note: Pull requests build but don't push images
          #
          # All scenarios create three rolling tags:
          #   1. {base-version}-{8-char-commit-hash} - Specific commit identifier
          #   2. latest - Always points to the most recent build
          #   3. {base-version}-latest - Latest build for that version line
          # Git-tag builds additionally push the IMMUTABLE {base-version} tag
          # (see the "Compute image tags" step below).
          #
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # Scenario 1: Manual workflow dispatch
            INPUT_VERSION="${{ github.event.inputs.version }}"
            if [ -z "${INPUT_VERSION}" ]; then
              # Use default from variable if input is empty
              INPUT_VERSION="${{ vars.DEFAULT_IMAGE_VERSION || 'v0.26.0' }}"
            fi
            echo "version=${INPUT_VERSION}" >> $GITHUB_OUTPUT
            echo "🔖 Base version: ${INPUT_VERSION}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            # Scenario 2: Git tag push
            VERSION="${GITHUB_REF#refs/tags/}"
            echo "version=${VERSION}" >> $GITHUB_OUTPUT
            echo "🔖 Base version: ${VERSION}"
          else
            # Scenario 3: Push to main branch or pull request
            DEFAULT_VERSION="${{ vars.DEFAULT_IMAGE_VERSION || 'v0.26.0' }}"
            echo "version=${DEFAULT_VERSION}" >> $GITHUB_OUTPUT
            echo "🔖 Base version: ${DEFAULT_VERSION}"
          fi

      # Git-tag builds (vX.Y.Z) additionally push the EXACT immutable tag: this
      # is the tag charts and app-state pin, so a deployed image is always
      # traceable to one commit and ArgoCD rolls pods on sync (no manual
      # rollout restart needed).
      - name: Compute image tags
        id: tags
        run: |
          TAGS="${ACR_REGISTRY}/${IMAGE_NAME}:${{ steps.version.outputs.version }}-${{ steps.sha.outputs.short_sha }}
          ${ACR_REGISTRY}/${IMAGE_NAME}:latest
          ${ACR_REGISTRY}/${IMAGE_NAME}:${{ steps.version.outputs.version }}-latest"
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAGS="${TAGS}
          ${ACR_REGISTRY}/${IMAGE_NAME}:${{ steps.version.outputs.version }}"
            echo "🔖 Release build: also pushing immutable tag ${{ steps.version.outputs.version }}"
          fi
          {
            echo "tags<<EOF"
            echo "${TAGS}"
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image digest
        run: |
          echo "✅ Image pushed: ${{ env.ACR_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}-${{ steps.sha.outputs.short_sha }}"
          echo "✅ Image pushed: ${{ env.ACR_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}-latest"
