# Publishes charts/azure-apim-operator via the shared operator release
# contract: PRs and main pushes validate only; a vX.Y.Z tag (matching
# Chart.yaml) pushes the chart to charts-src/azure-apim-operator, which Helmut
# ingests into helm-charts - the path clusters consume. GHCR is kept as a
# secondary target (oci://ghcr.io/hedinbil/charts) inside the same tag-gated
# job, replacing the former build-helm-chart-to-ghcr.yml.
name: Publish Helm Chart

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

permissions:
  id-token: write
  contents: read
  packages: write

jobs:
  chart:
    # This repo is public, so it uses the public copy of the shared workflow;
    # the internal hedin-github-actions repo is not accessible from public repos.
    uses: hedinbil/hedin-github-actions-public/.github/workflows/publish-operator-chart.yml@main
    with:
      chart-name: azure-apim-operator
      azure-client-id: ${{ vars.OPERATIONS_AKS_PROD_AZURE_CLIENT_ID }}
      azure-subscription-id: ${{ vars.OPERATIONS_AKS_PROD_AZURE_SUBSCRIPTION_ID }}
      azure-tenant-id: ${{ vars.AZURE_TENANT_ID }}
      publish-to-ghcr: true
