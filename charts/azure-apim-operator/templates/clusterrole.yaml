apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "azure-apim-operator.fullname" . }}
  labels:
    app.kubernetes.io/name: {{ include "azure-apim-operator.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
rules:
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apim.operator.io"]
    resources: ["apimapis"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apim.operator.io"]
    resources: ["apimapis/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["apim.operator.io"]
    resources: ["apimapis/finalizers"]
    verbs: ["update"]
  - apiGroups: ["apim.operator.io"]
    resources: ["apimapideployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]   
  - apiGroups: ["apim.operator.io"]
    resources: ["apimapideployments/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["apim.operator.io"]
    resources: ["apimapideployments/finalizers"]
    verbs: ["update"]
  # APIMService is a configuration record the other controllers read to locate
  # the APIM instance; nothing writes it, so read-only (APIM-17).
  - apiGroups: ["apim.operator.io"]
    resources: ["apimservices"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apim.operator.io"]
    resources: ["apimproducts"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apim.operator.io"]
    resources: ["apimproducts/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["apim.operator.io"]
    resources: ["apimproducts/finalizers"]
    verbs: ["update"]
  - apiGroups: ["apim.operator.io"]
    resources: ["apimtags"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apim.operator.io"]
    resources: ["apimtags/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["apim.operator.io"]
    resources: ["apimtags/finalizers"]
    verbs: ["update"]
  - apiGroups: ["apim.operator.io"]
    resources: ["apiminboundpolicies"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apim.operator.io"]
    resources: ["apiminboundpolicies/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["apim.operator.io"]
    resources: ["apiminboundpolicies/finalizers"]
    verbs: ["update"]


---
# Aggregated into the built-in view/edit/admin ClusterRoles so teams can read
# the APIM custom resources in their own namespaces with kubectl. A CRD is
# invisible to the built-in roles unless an aggregated role opts it in.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "azure-apim-operator.fullname" . }}-view
  labels:
    app.kubernetes.io/name: {{ include "azure-apim-operator.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    rbac.authorization.k8s.io/aggregate-to-view: "true"
    rbac.authorization.k8s.io/aggregate-to-edit: "true"
    rbac.authorization.k8s.io/aggregate-to-admin: "true"
rules:
  - apiGroups: ["apim.operator.io"]
    resources:
      - apimapis
      - apimapideployments
      - apiminboundpolicies
      - apimproducts
      - apimservices
      - apimtags
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apim.operator.io"]
    resources:
      - apimapis/status
      - apimapideployments/status
      - apiminboundpolicies/status
      - apimproducts/status
      - apimservices/status
      - apimtags/status
    verbs: ["get"]
---
# Write verbs aggregated into edit/admin only - never view - so a team that
# owns a namespace can remove the APIM custom resources in it and therefore
# delete the namespace itself. patch is what clears a stuck finalizer.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "azure-apim-operator.fullname" . }}-edit
  labels:
    app.kubernetes.io/name: {{ include "azure-apim-operator.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    rbac.authorization.k8s.io/aggregate-to-edit: "true"
    rbac.authorization.k8s.io/aggregate-to-admin: "true"
rules:
  - apiGroups: ["apim.operator.io"]
    resources:
      - apimapis
      - apimapideployments
      - apiminboundpolicies
      - apimproducts
      - apimservices
      - apimtags
    verbs: ["create", "update", "patch", "delete"]
