# Default values for azure-apim-operator.

replicaCount: 1

image:
  # The release workflow publishes images to the Hedin ACR; ghcr.io no longer
  # receives new versions. Override for another registry if needed.
  repository: hedinit.azurecr.io/azure-apim-operator
  pullPolicy: IfNotPresent
  # Defaults to v<appVersion>: the release contract keeps chart version,
  # appVersion, git tag and image tag equal.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: azure-apim-operator
  # Azure Workload Identity: the webhook injects AZURE_CLIENT_ID and
  # AZURE_TENANT_ID from these values.
  workloadIdentity:
    enabled: true
    clientID: <replace-with-default-or-empty>
    tenantID: <replace-with-default-or-empty>

# The manager's Prometheus endpoint (controller-runtime reconcile, workqueue and
# rest-client series). Served as plain HTTP on a container port; the chart ships
# no Service, so only node-local scrapers such as the Datadog agent reach it.
metrics:
  enabled: true
  port: 8080
  datadog:
    # Renders the openmetrics autodiscovery annotation for the container, so the
    # node's Datadog agent scrapes the pod directly.
    enabled: true
    # Metric families to collect. Keep this list short: Datadog bills per custom
    # metric and controller-runtime exposes several hundred series.
    metrics:
      - controller_runtime_reconcile_total
      - controller_runtime_reconcile_errors_total
      - controller_runtime_reconcile_time_seconds
      - controller_runtime_active_workers
      - workqueue_depth
      - workqueue_unfinished_work_seconds
      - rest_client_requests_total

# Leader election flag passed to the manager.
leaderElect: true

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - "ALL"

resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 20m
    memory: 64Mi

# The manager serves its probes on 8081. There is no Service: nothing else
# listens.
livenessProbe:
  httpGet:
    path: /healthz
    port: 8081
  initialDelaySeconds: 15
  periodSeconds: 20
readinessProbe:
  httpGet:
    path: /readyz
    port: 8081
  initialDelaySeconds: 5
  periodSeconds: 10

volumes: []
volumeMounts: []
nodeSelector: {}
tolerations: []
affinity: {}

# APIM instances the operator may manage, rendered as APIMService resources:
#   - name: apim-example
#     resourceGroup: rg-example
#     subscription: 00000000-0000-0000-0000-000000000000
apimServices: []

swagger:
  # Annotation on a Deployment or ReplicaSet that names the OpenAPI export path.
  annotationKey: "operator.io/openapi-export"
  # Path used when the annotation is absent.
  defaultPath: "/swagger.yaml"
