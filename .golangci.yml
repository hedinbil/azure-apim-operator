version: "2"
run:
  allow-parallel-runners: true
linters:
  default: none
  enable:
    - copyloopvar
    - dupl
    - errcheck
    - ginkgolinter
    - goconst
    - gocyclo
    - govet
    - ineffassign
    - lll
    - misspell
    - nakedret
    - prealloc
    - revive
    - staticcheck
    - unconvert
    - unparam
    - unused
  settings:
    goconst:
      # Wire-format keys (JSON and HCL attribute names) read better inline
      # than behind a named constant.
      ignore-string-values:
        - '^(body|sha|source|version|properties)$'
    revive:
      rules:
        - name: comment-spacings
    staticcheck:
      # Ginkgo and Gomega are a DSL and are dot-imported by design.
      dot-import-whitelist:
        - github.com/onsi/ginkgo/v2
        - github.com/onsi/gomega
  exclusions:
    generated: lax
    rules:
      - linters:
          - lll
        path: api/*
      - linters:
          - dupl
          - lll
        path: internal/*
      # e2e scenarios repeat the same arrange, act, assert shape on purpose.
      - linters:
          - dupl
        path: test/e2e/*
      # Repeated literals read better inline in tests.
      - linters:
          - goconst
        path: _test\.go
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
